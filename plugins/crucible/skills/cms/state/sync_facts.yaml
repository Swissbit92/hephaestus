# CMS drift-detection facts.
#
# Each fact is a canonical value that tends to drift across docs (version
# numbers, status strings, counts). `/crucible:cms sync` scans every *.md
# under the root and flags any captured value that disagrees with
# expected_value, or any fact with multiple distinct values across files.
#
# Add facts as you discover drift. Format:
#
# facts:
#   - name: portfolio-version
#     pattern: 'portfolio v(\d+\.\d+\.\d+)'   # one capture group = the value
#     expected_value: "1.13.1"                 # or null to only check internal consistency
#     note: |
#       Bump here whenever the deployed portfolio version changes.
#
# This starter ships empty — `sync` will report "no facts defined" until you
# add some.
#
# WHERE YOUR FACTS GO. This file is shipped config inside a generic plugin, so it
# must stay free of project-specific tokens; `tests/test_seam.py` fails the build
# if one appears. Keep your own facts in your repo and point at them:
#
#     sync.py <root> --facts .claude/cms_sync_facts.yaml
#
# Same format, same loader — only the location differs.
#
# ── Choosing a pattern: the failure worth knowing before you hit it ──────────
#
# A pattern that is *correct* can still be unusable, and the trap is specific:
# `sync` has no per-file scoping, so a pattern matching a current value will also
# match every superseded value of the same shape. CHANGELOG and ROADMAP tables
# record old versions, old percentages and old counts **correctly** — that is what
# a changelog is — and a fact keyed on the bare number cannot tell "the current
# value, stated in two places" from "the history of that value, stated accurately".
#
# Two facts were tried on version-shaped and percentage-shaped values and withdrawn
# on 2026-08-22 for exactly this reason. Both found real drift; both also lit up
# every dated history row. A checker that reports drift on lines that are right is
# one people learn to ignore, and an ignored checker is worse than an absent one.
#
# So prefer a pattern anchored to prose that only the CURRENT statement uses — a
# surrounding phrase, a label, a sentence fragment — over one that matches the
# value alone. Re-visit if per-file scoping ever lands.

facts: []
