[project]
name = "sqlite-readonly"
version = "0.1.0"
description = "Zero-config read-only SQLite MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
sqlite-readonly = "sqlite_readonly.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlite_readonly"]
