[project]
name = "example-server"
version = "0.1.0"
description = "Minimal example MCP server for the mcp-starter template"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
example-server = "example_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["example_server"]
