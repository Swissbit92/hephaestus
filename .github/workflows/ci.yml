name: CI

on:
  push:
    # `dev` is where work actually lands; `main` is the promotion target. Gating only on
    # `main` meant every check ran for the first time at the moment of publication —
    # after review, on a merge commit nobody was still looking at. Both branches now.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly behavioural check. A skill's prose can stop working without any file in this
    # repo changing — the model underneath it moves — so this is the one check that must
    # fire on a calendar rather than on a diff.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the live eval suite"
        required: false
        default: "claude-haiku-4-5-20251001"
      k:
        description: "Runs per scenario (higher = tighter confidence, more tokens)"
        required: false
        default: "3"

jobs:
  # Tier 1 — fast, hermetic, no API/credentials. Runs on every push + PR.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Unit + eval-core suite (pytest)
        # The live skill-eval tests are marked `requires_claude` and auto-skip here
        # (no claude CLI in stock CI); everything pure/headless runs.
        run: pytest -q

      - name: Validate plugin + marketplace manifests
        run: python3 scripts/validate_manifests.py

      - name: Skill quality (budget + cross-skill duplication)
        # --strict fails on warnings. If this goes red, fix the skill — not the
        # threshold; the thresholds are pinned by tests for exactly that reason.
        run: python3 plugins/crucible/scripts/skill_lint.py --strict

      - name: Public-safety guard (no private/employer tokens)
        run: bash scripts/check-public-safe.sh

  # Tier 1b — the same hermetic suite on the other two platforms this marketplace is
  # used from. A separate job, deliberately NOT a matrix on `checks`: branch protection
  # requires a status check named exactly `checks`, and matrixing that job would rename
  # it to `checks (ubuntu-latest)` and detach the rule without anything appearing to
  # break. ubuntu is already covered above, so this runs the other two.
  #
  # It exists because every portability defect this repo has had was invisible from a
  # POSIX machine: `python3` resolving to a Store stub that runs nothing, a passing gate
  # exiting 1 because it printed a check-mark to a cp1252 console, backslashes in an
  # emitted shell command. None of those can fail on ubuntu.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Unit + eval-core suite (pytest)
        run: pytest -q

      - name: Phase 4.0 gates must run here too
        run: |
          python scripts/validate_manifests.py
          python plugins/crucible/scripts/skill_lint.py --strict
          python plugins/crucible/scripts/detect_profile.py --emit-gates

  # Tier 1c — the same hermetic suite across the interpreter range the README promises.
  # A separate job for exactly the reason `cross-platform` is one: matrixing `checks` would
  # rename the required status check and detach branch protection without anything looking
  # broken.
  #
  # The OS matrix could never have caught what motivated this. Every job pinned 3.12 while
  # the README promised 3.9+, and one PEP 701 f-string in site.py made `pytest` unable to
  # *collect* on 3.9, 3.10 and 3.11 — the whole suite unavailable, not one degraded feature.
  # Varying the OS and never the Python left that invisible on all three platforms.
  #
  # 3.12 is already covered by `checks`, so it is not repeated here.
  python-floor:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: pip install pytest

      - name: Static floor check (grammar + f-string constructs)
        run: python scripts/python_floor.py --repo .

      - name: Suite must collect and pass on this interpreter
        # Collection is the point. A syntax error in any shipped module takes the entire
        # run down, so "it collected" is already most of what this job proves.
        run: pytest -q

  # Tier 2 (DISABLED by default) — the live skill-eval suite. It drives the real `claude`
  # CLI against the plugins, so it needs the CLI installed and an API key, and it spends
  # tokens. Enable by (a) removing `if: false`, (b) adding an ANTHROPIC_API_KEY repo secret,
  # and (c) running the harness in hermetic mode (bare=True uses ANTHROPIC_API_KEY instead
  # of an interactive login). Consider gating it to PRs that touch skills/ to control cost.
  live-eval:
    # No longer `if: false`. It was disabled because it spends tokens on every push —
    # so it now runs only when asked for, or once a week, rather than never.
    #
    # It needs an ANTHROPIC_API_KEY repo secret, because CI has no logged-in session and
    # the runner must use bare mode. Without the secret the job fails fast and says so,
    # which is the honest state: "not configured" must not look like "passing". Locally
    # you do NOT need a key — `run_evals.py` defaults to bare=False and uses your existing
    # login, so the behavioural suite is free to run on a subscription. See evals/README.md.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # A cheap model by default: these scenarios assert *behavioural compliance* with a
      # SKILL.md — did it refuse the merge, did it avoid pushing — not reasoning depth, so
      # the frontier model is not what is under test. Override per-run via the input.
      EVAL_MODEL: ${{ inputs.model || 'claude-haiku-4-5-20251001' }}
      EVAL_K: ${{ inputs.k || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail fast when the key is absent
        # Exit 2, not 1: "could not determine" is this repo's code for a check that did not
        # run, and it must never be reported as one that passed.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set — the live suite cannot run." >&2
            echo "Add it under Settings > Secrets > Actions, or run the suite locally" >&2
            echo "with your existing login: python3 evals/run_evals.py" >&2
            exit 2
          fi
      - name: Install claude CLI + uv + pytest
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install pytest
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run the skill-eval suite (hermetic)
        run: python3 evals/run_evals.py -k "$EVAL_K" --model "$EVAL_MODEL" --bare --json evals/baselines/ci.json
      - name: Keep the report even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/baselines/ci.json
          if-no-files-found: warn
